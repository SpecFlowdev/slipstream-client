name: Android engine

# Cross-compiles the tunnel for Android and uploads what comes out.
#
# The recipe itself lives in scripts/build-android-engine.sh so the APK
# workflow builds the engine exactly the same way this does.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream slipstream-rust ref to build
        default: v0.1.1
      abis:
        description: Space-separated Rust target triples
        default: aarch64-linux-android armv7-linux-androideabi

permissions:
  contents: read

jobs:
  build:
    name: Cross-compile the tunnel for Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check out slipstream-rust
        uses: actions/checkout@v5
        with:
          repository: Mygod/slipstream-rust
          ref: ${{ inputs.ref }}
          path: upstream
          # picoquic is a submodule, and it is what actually gets compiled.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Add the Android targets
        run: |
          for target in ${{ inputs.abis }}; do
            rustup target add "${target}"
          done

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream

      - name: Build
        run: ./scripts/build-android-engine.sh upstream "${PWD}/out" ${{ inputs.abis }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-engine
          path: out/
          if-no-files-found: error
